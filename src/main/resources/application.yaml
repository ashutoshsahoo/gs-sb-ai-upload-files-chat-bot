spring:
  application:
    name: gs-sb-upload-files-chat-boot
  main:
    banner-mode: OFF
  threads:
    virtual:
      enabled: true # Enable max DB and client connections
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: changeme

    hikari:
      # Minimum number of idle connections waiting in the pool
      minimum-idle: 2
      # Maximum number of active connections the pool will keep
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

    properties:
      # Fetches 100 rows at a time (a safe, balanced default)
      hibernate.jdbc.fetch_size: 100
      # Tells Hibernate not to waste performance checking autocommit status
      #      hibernate.connection.provider_disables_autocommit: true

      hibernate.show_sql: true
      hibernate.format_sql: true
      hibernate.use_sql_comments: true
      hibernate.jdbc.time_zone: UTC

  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
        schema-validation: true
        remove-existing-vector-store-table: false

    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma4
      embedding:
        model: nomic-embed-text

logging:
  level:
    org.apache.hc.client5.http.wire: DEBUG
    org.hibernate.orm.connections.pooling: ERROR
    org.zalando.logbook.Logbook: TRACE
    org.springframework.ai.chat.client.advisor: DEBUG
    in.ashu.practice: DEBUG

logbook:
  format.style: http
  predicate:
    include:
      - path: /api/**
